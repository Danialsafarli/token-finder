<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Evidence-grade intelligence on newly launched Solana tokens: every verdict with its evidence, its gaps and its history." />
    <title>Token Finder</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body data-connection="connecting">
    <a class="skip" href="#main">Skip to content</a>

    <header class="topbar">
      <a class="brand" href="/" data-link aria-label="Token Finder — home">
        <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="3.5" width="17" height="17" rx="4.5" class="brand__frame" />
          <path d="M8 8.5h8M8 12h5.5M8 15.5h3" class="brand__lines" />
          <circle cx="16" cy="15.5" r="1.6" class="brand__dot" />
        </svg>
        <span class="brand__name">Token Finder</span>
        <span class="brand__chain">Solana</span>
      </a>

      <nav class="nav" aria-label="Primary">
        <a class="nav__link" href="/discover" data-link data-nav="discover">Discover</a>
        <a class="nav__link" href="/changes" data-link data-nav="changes">Changes</a>
        <a class="nav__link" href="/system" data-link data-nav="system">System</a>
      </nav>

      <div class="live" id="live">
        <span class="live__dot" aria-hidden="true"></span>
        <span class="live__text" id="live-text" role="status" aria-live="polite">Connecting…</span>
        <button type="button" class="btn btn--small" id="scan-now" disabled>Scan now</button>
      </div>
    </header>

    <div class="conn" id="conn-banner" role="alert" hidden></div>

    <main id="main" class="main" tabindex="-1">
      <noscript><p class="state state--error">Token Finder needs JavaScript to run.</p></noscript>
    </main>
  </body>
</html>
