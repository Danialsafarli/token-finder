# Fly.io: one machine, one volume. SQLite needs a single writer, so this app
# must never scale beyond one machine. See DEPLOYMENT.md.
#
#   fly launch --no-deploy --copy-config --name <app>
#   fly volumes create token_finder_data --size 3 --region <region>
#   fly secrets set HELIUS_API_KEY=... PUBLIC_ORIGIN=https://<app>.fly.dev
#   fly deploy

app = "token-finder"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  TOKEN_FINDER_DATA_DIR = "/data"
  TRUST_PROXY = "true"

[[mounts]]
  source = "token_finder_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The scanner is the product: the machine must stay up between visits.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
